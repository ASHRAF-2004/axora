services:
  - type: web
    name: axora-operations
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh server-tools/render-start.sh
    healthCheckPath: /api/health/live
    renderSubdomainPolicy: enabled
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: axora-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@axora.local
      - key: ADMIN_DISPLAY_NAME
        value: Ashraf
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

databases:
  - name: axora-db
    plan: free
    region: singapore
    databaseName: axora
    user: axora
    ipAllowList: []
