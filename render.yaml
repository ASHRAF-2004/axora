services:
  - type: web
    name: axora-operations
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh server-tools/render-start.sh
    healthCheckPath: /api/health/ready
    renderSubdomainPolicy: enabled
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "false"
      - key: SKIP_DATABASE_MIGRATIONS
        value: "true"
      - key: TAILSCALE_AUTH_KEY
        sync: false
      - key: TAILSCALE_DB_HOST
        value: axora-db
      - key: TAILSCALE_DB_PORT
        value: "5432"
      - key: TAILSCALE_HOSTNAME
        value: axora-render
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: axora-db
    plan: free
    region: singapore
    databaseName: axora
    user: axora
    ipAllowList: []
