name: axora

services:
  db:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    # Secret files are owned by the Ubuntu deployment user (UID/GID 1000).
    # Add that group so PostgreSQL can read them without making secrets world-readable.
    group_add:
      - "1000"
    environment:
      POSTGRES_DB: axora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - axora_app_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/admin:/database/admin:ro
      - ./database/migrations:/migrations:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axora"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: "no"
    group_add:
      - "1000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: axora
      PGHOST: db
    entrypoint: ["/bin/sh", "/database/init/01-run-migration.sh"]
    secrets:
      - postgres_admin_password
    volumes:
      - ./database/init:/database/init:ro
      - ./database/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: axora-app:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    group_add:
      - "1000"
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: axora
      DB_USER: axora_app
      DB_PASSWORD_FILE: /run/secrets/axora_app_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
      APP_BASE_URL: "https://${AXORA_HOST:?Set AXORA_HOST in .env}"
      AXORA_EMAIL_DELIVERY_ENABLED: "${AXORA_EMAIL_DELIVERY_ENABLED:-false}"
      AXORA_EMAIL_EVENTS_ENABLED: "${AXORA_EMAIL_EVENTS_ENABLED:-false}"
      ZEPTOMAIL_WEBHOOK_BOOTSTRAP_ENABLED: "${ZEPTOMAIL_WEBHOOK_BOOTSTRAP_ENABLED:-false}"
      AXORA_EMAIL_PROVIDER: "${AXORA_EMAIL_PROVIDER:-cloudflare-email-service}"
      AXORA_EMAIL_SENDER_URL: "http://email-sender:3100"
      AXORA_EMAIL_SERVICE_AUTH_KEY_FILE: /run/secrets/axora_email_service_auth_key
      AXORA_EMAIL_EVENTS_WEBHOOK_SECRET_FILE: /run/secrets/axora_email_events_webhook_secret
      ZEPTOMAIL_WEBHOOK_AUTH_KEY_FILE: /run/secrets/axora_email_events_webhook_secret
      ZEPTOMAIL_MAIL_AGENT_KEY: "${ZEPTOMAIL_MAIL_AGENT_KEY:-}"
      ZEPTOMAIL_ACCOUNT_REVIEWED: "${ZEPTOMAIL_ACCOUNT_REVIEWED:-false}"
      ZEPTOMAIL_DOMAIN_VERIFIED: "${ZEPTOMAIL_DOMAIN_VERIFIED:-false}"
      ZEPTOMAIL_CREDITS_READY: "${ZEPTOMAIL_CREDITS_READY:-false}"
      ZEPTOMAIL_WEBHOOK_VERIFIED: "${ZEPTOMAIL_WEBHOOK_VERIFIED:-false}"
      RESEND_DOMAIN_VERIFIED: "${RESEND_DOMAIN_VERIFIED:-false}"
      RESEND_WEBHOOK_VERIFIED: "${RESEND_WEBHOOK_VERIFIED:-false}"
      RESEND_WEBHOOK_SECRET_FILE: /run/secrets/resend_webhook_secret
      ZEPTOMAIL_AUTH_AGENT_KEY: "${ZEPTOMAIL_AUTH_AGENT_KEY:-}"
      ZEPTOMAIL_PROCUREMENT_AGENT_KEY: "${ZEPTOMAIL_PROCUREMENT_AGENT_KEY:-}"
      ZEPTOMAIL_BUDGET_AGENT_KEY: "${ZEPTOMAIL_BUDGET_AGENT_KEY:-}"
      ZEPTOMAIL_DELIVERY_AGENT_KEY: "${ZEPTOMAIL_DELIVERY_AGENT_KEY:-}"
      ZEPTOMAIL_DOCUMENTS_AGENT_KEY: "${ZEPTOMAIL_DOCUMENTS_AGENT_KEY:-}"
      ZEPTOMAIL_PLATFORM_AGENT_KEY: "${ZEPTOMAIL_PLATFORM_AGENT_KEY:-}"
      ACCOUNT_SETUP_TTL_HOURS: "${ACCOUNT_SETUP_TTL_HOURS:-24}"
      AXORA_EMAIL_REPLY_TO: "${AXORA_EMAIL_REPLY_TO:-support@axora.management}"
      # Server-only monitored inbox; never expose this as NEXT_PUBLIC_*.
      AXORA_CONTACT_NOTIFICATION_TO: "${AXORA_CONTACT_NOTIFICATION_TO:-}"
      AXORA_UPLOADS_CONTAINER_DIR: /app/data/uploads
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_FILE: /run/secrets/turnstile_secret
      TURNSTILE_HOSTNAMES: "${TURNSTILE_HOSTNAMES:-axora.management}"
      AXORA_TURNSTILE_EXPECTED_HOSTNAME: "${AXORA_TURNSTILE_EXPECTED_HOSTNAME:-axora.management}"
    secrets:
      - axora_app_password
      - session_secret
      - axora_email_service_auth_key
      - axora_email_events_webhook_secret
      - resend_webhook_secret
      - turnstile_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    volumes:
      - ./data/uploads:/app/data/uploads
    networks:
      - frontend
      - backend
      - mail
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  email-sender:
    image: axora-app:1.0.0
    restart: unless-stopped
    init: true
    read_only: true
    group_add:
      - "1000"
    command: ["node", "server-tools/email-sender.mjs"]
    environment:
      NODE_ENV: production
      EMAIL_SENDER_PORT: "3100"
      AXORA_EMAIL_DELIVERY_ENABLED: "${AXORA_EMAIL_DELIVERY_ENABLED:-false}"
      APP_BASE_URL: "https://${AXORA_HOST:?Set AXORA_HOST in .env}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_EMAIL_API_TOKEN_FILE: /run/secrets/cloudflare_email_api_token
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      ZEPTOMAIL_SEND_TOKEN_FILE: /run/secrets/zeptomail_send_token
      ZEPTOMAIL_SEND_TOKEN_NEXT_FILE: /run/secrets/zeptomail_send_token_next
      AXORA_ZEPTOMAIL_TOKEN_SLOT: "${AXORA_ZEPTOMAIL_TOKEN_SLOT:-primary}"
      AXORA_EMAIL_SERVICE_AUTH_KEY_FILE: /run/secrets/axora_email_service_auth_key
      AXORA_EMAIL_OUTBOX_URL: "http://app:3000/account/email-outbox"
      AXORA_EMAIL_PROVIDER: "${AXORA_EMAIL_PROVIDER:-cloudflare-email-service}"
      AXORA_EMAIL_FROM_ADDRESS: "${AXORA_EMAIL_FROM_ADDRESS:-noreply@axora.management}"
      AXORA_EMAIL_FROM_NAME: "${AXORA_EMAIL_FROM_NAME:-Axora}"
      AXORA_EMAIL_REPLY_TO: "${AXORA_EMAIL_REPLY_TO:-support@axora.management}"
    secrets:
      - cloudflare_email_api_token
      - resend_api_key
      - zeptomail_send_token
      - zeptomail_send_token_next
      - axora_email_service_auth_key
    expose:
      - "3100"
    networks:
      mail: {}
      # Compose selects the highest gw_priority as the default route. Keep
      # outbound Internet access on this dedicated network, never on mail.
      email-egress:
        gw_priority: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  budget-worker:
    image: axora-app:1.0.0
    restart: unless-stopped
    init: true
    read_only: true
    group_add:
      - "1000"
    command: ["node", "server-tools/budget-worker.mjs"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: axora
      DB_USER: axora_app
      DB_PASSWORD_FILE: /run/secrets/axora_app_password
      BUDGET_WORKER_PORT: "3101"
      BUDGET_WORKER_INTERVAL_MS: "15000"
    secrets:
      - axora_app_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3101"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  document-worker:
    image: axora-app:1.0.0
    restart: unless-stopped
    init: true
    read_only: true
    group_add:
      - "1000"
    command: ["node", "server-tools/document-worker.mjs"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: axora
      DB_USER: axora_app
      DB_PASSWORD_FILE: /run/secrets/axora_app_password
      AXORA_UPLOADS_CONTAINER_DIR: /app/data/uploads
      DOCUMENT_WORKER_PORT: "3102"
      DOCUMENT_WORKER_INTERVAL_MS: "15000"
    secrets:
      - axora_app_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3102"
    volumes:
      - ./data/uploads:/app/data/uploads
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  # Developer-only captured email viewer. It is excluded unless the explicit
  # email-preview profile is selected and is never part of production ingress.
  mailpit:
    profiles: ["email-preview"]
    image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    restart: "no"
    read_only: true
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "100"
      MP_MAX_AGE: 24h
      MP_ALLOW_INTERNAL_HTTP_REQUESTS: "false"
    command:
      - --listen
      - "127.0.0.1:${MAILPIT_PREVIEW_PORT:-8025}"
      - --smtp
      - "127.0.0.1:0"
      - --pop3
      - "127.0.0.1:0"
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Host networking avoids Docker port-publishing differences while the
    # explicit loopback listener above keeps the viewer private to this PC.
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "2"

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      AXORA_HOST: "${AXORA_HOST:?Set AXORA_HOST in .env}"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - target: 80
        published: "80"
        host_ip: "${LAN_IP:?Set LAN_IP in .env}"
        protocol: tcp
      - target: 443
        published: "443"
        host_ip: "${LAN_IP:?Set LAN_IP in .env}"
        protocol: tcp
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

networks:
  frontend:
  backend:
    internal: true
  mail:
    internal: true
  email-egress:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  axora_app_password:
    file: ./secrets/axora_app_password
  session_secret:
    file: ./secrets/session_secret
  cloudflare_email_api_token:
    file: ./secrets/cloudflare_email_api_token
  resend_api_key:
    file: ./secrets/resend_api_key
  zeptomail_send_token:
    file: ./secrets/zeptomail_send_token
  zeptomail_send_token_next:
    file: ./secrets/zeptomail_send_token_next
  axora_email_service_auth_key:
    file: ./secrets/axora_email_service_auth_key
  axora_email_events_webhook_secret:
    file: ./secrets/axora_email_events_webhook_secret
  resend_webhook_secret:
    file: ./secrets/resend_webhook_secret
  turnstile_secret:
    file: ./secrets/turnstile_secret
