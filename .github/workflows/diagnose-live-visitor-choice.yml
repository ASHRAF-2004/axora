name: Diagnose live visitor choice

on:
  push:
    branches:
      - hotfix/visitor-choice-verification-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diagnose-live-visitor-choice
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read-only production browser trace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Trace production without allowing a visitor claim
        shell: bash
        run: |
          set -Eeuo pipefail

          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";

          const baseUrl = "https://axora.management";
          const browser = await chromium.launch();
          const context = await browser.newContext({
            locale: "en-US",
            viewport: { width: 1280, height: 900 },
            serviceWorkers: "block",
          });
          await context.addCookies([
            { name: "axora_locale", value: "en", url: baseUrl },
          ]);
          const page = await context.newPage();

          let apiScriptRequested = false;
          let apiScriptStatus = null;
          let challengeRequestCount = 0;
          let visitorPostAttempted = 0;
          let visitorPostBlocked = 0;
          let pageErrorCount = 0;

          await page.route("**/*", async (route) => {
            const request = route.request();
            const url = new URL(request.url());
            if (
              url.origin === baseUrl &&
              url.pathname === "/api/public/visitor-choice" &&
              request.method() === "POST"
            ) {
              visitorPostBlocked += 1;
              await route.abort("blockedbyclient");
              return;
            }
            await route.continue();
          });

          page.on("pageerror", () => {
            pageErrorCount += 1;
          });
          page.on("request", (request) => {
            const url = new URL(request.url());
            if (url.origin === "https://challenges.cloudflare.com") {
              challengeRequestCount += 1;
            }
            if (
              url.origin === "https://challenges.cloudflare.com" &&
              url.pathname === "/turnstile/v0/api.js"
            ) {
              apiScriptRequested = true;
            }
            if (
              url.origin === baseUrl &&
              url.pathname === "/api/public/visitor-choice" &&
              request.method() === "POST"
            ) {
              visitorPostAttempted += 1;
            }
          });

          page.on("response", (response) => {
            const url = new URL(response.url());
            if (
              url.origin === "https://challenges.cloudflare.com" &&
              url.pathname === "/turnstile/v0/api.js"
            ) {
              apiScriptStatus = response.status();
            }
          });

          const navigation = await page.goto(
            `${baseUrl}/en?diagnosis=visitor-choice`,
            { waitUntil: "domcontentloaded", timeout: 30_000 },
          );
          if (!navigation || navigation.status() !== 200) {
            throw new Error("Production English homepage did not load.");
          }

          const section = page.getByRole("region", {
            name: "Which side are you on?",
          });
          await section.waitFor({ state: "visible", timeout: 15_000 });
          const choice = section.getByRole("button", {
            name: "Choose Early Birds",
          });
          await choice.waitFor({ state: "visible", timeout: 15_000 });
          await page.waitForTimeout(4_000);

          const apiStateBeforeClick = await page.evaluate(() => ({
            present: Boolean(window.turnstile),
            ready: typeof window.turnstile?.ready === "function",
            render: typeof window.turnstile?.render === "function",
            execute: typeof window.turnstile?.execute === "function",
          }));

          await page.evaluate(() => {
            const api = window.turnstile;
            const trace = {
              ready: 0,
              render: 0,
              execute: 0,
              reset: 0,
              remove: 0,
              successCallback: 0,
              errorCallback: 0,
              expiredCallback: 0,
              timeoutCallback: 0,
              unsupportedCallback: 0,
              renderReturnedUsableId: false,
            };
            Object.defineProperty(window, "__axoraTurnstileTrace", {
              value: trace,
              configurable: true,
            });
            if (!api) return;

            for (const name of ["ready", "execute", "reset", "remove"]) {
              const original = api[name];
              if (typeof original !== "function") continue;
              api[name] = function (...args) {
                trace[name] += 1;
                return original.apply(this, args);
              };
            }

            const originalRender = api.render;
            if (typeof originalRender === "function") {
              api.render = function (...args) {
                trace.render += 1;
                const options = args[1];
                if (options && typeof options === "object") {
                  const callbackMap = {
                    callback: "successCallback",
                    "error-callback": "errorCallback",
                    "expired-callback": "expiredCallback",
                    "timeout-callback": "timeoutCallback",
                    "unsupported-callback": "unsupportedCallback",
                  };
                  for (const [optionName, traceName] of Object.entries(callbackMap)) {
                    const originalCallback = options[optionName];
                    if (typeof originalCallback !== "function") continue;
                    options[optionName] = function (...callbackArgs) {
                      trace[traceName] += 1;
                      return originalCallback.apply(this, callbackArgs);
                    };
                  }
                }
                const result = originalRender.apply(this, args);
                trace.renderReturnedUsableId =
                  typeof result === "string" && result.trim().length > 0;
                return result;
              };
            }
          });

          const iframeBeforeClick = page.frames().some((frame) => {
            try {
              return new URL(frame.url()).origin
                === "https://challenges.cloudflare.com";
            } catch {
              return false;
            }
          });

          await choice.click();
          await page.waitForTimeout(20_000);

          const apiStateAfterClick = await page.evaluate(() => ({
            present: Boolean(window.turnstile),
            ready: typeof window.turnstile?.ready === "function",
            render: typeof window.turnstile?.render === "function",
            execute: typeof window.turnstile?.execute === "function",
          }));
          const callTrace = await page.evaluate(() =>
            window.__axoraTurnstileTrace ?? null,
          );
          const iframeAfterClick = page.frames().some((frame) => {
            try {
              return new URL(frame.url()).origin
                === "https://challenges.cloudflare.com";
            } catch {
              return false;
            }
          });
          const statusText = (
            await section.locator('[role="status"], [role="alert"]').allTextContents()
          ).join(" ").replace(/\s+/g, " ").trim();
          const claimCookiePresent = (await context.cookies(baseUrl)).some(
            (cookie) => cookie.name === "axora_visitor_claim",
          );

          console.log(`Turnstile api.js requested: ${apiScriptRequested}`);
          console.log(`Turnstile api.js response status: ${apiScriptStatus ?? "none"}`);
          console.log(`Cloudflare challenge requests observed: ${challengeRequestCount}`);
          console.log(`Turnstile API before click: ${JSON.stringify(apiStateBeforeClick)}`);
          console.log(`Turnstile API after click: ${JSON.stringify(apiStateAfterClick)}`);
          console.log(`Turnstile call trace: ${JSON.stringify(callTrace)}`);
          console.log(`Turnstile iframe before click: ${iframeBeforeClick}`);
          console.log(`Turnstile iframe after click: ${iframeAfterClick}`);
          console.log(`Visitor-choice POST attempted: ${visitorPostAttempted}`);
          console.log(`Visitor-choice POST blocked before network: ${visitorPostBlocked}`);
          console.log(`Permanent claim cookie present: ${claimCookiePresent}`);
          console.log(`Page error count: ${pageErrorCount}`);
          console.log(`Final localized UI status: ${statusText || "none"}`);

          if (visitorPostBlocked !== visitorPostAttempted) {
            throw new Error("A production visitor-choice POST was not intercepted.");
          }
          if (claimCookiePresent) {
            throw new Error("Diagnostic browser received a permanent claim cookie.");
          }

          await browser.close();
          NODE
