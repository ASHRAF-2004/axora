name: Refresh P0-02 lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the P0-02 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/p0-02-isolation-closure
          persist-credentials: true
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: npm

      - name: Apply the verified minimal lockfile patch
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const file = "package-lock.json";
          const lock = JSON.parse(readFileSync(file, "utf8"));
          const entry = lock.packages?.["node_modules/nanoid"];
          if (!entry || !["3.3.16", "3.3.17"].includes(entry.version)) {
            throw new Error(`Unexpected nanoid lock entry: ${entry?.version ?? "missing"}`);
          }
          Object.assign(entry, {
            version: "3.3.17",
            resolved: "https://registry.npmjs.org/nanoid/-/nanoid-3.3.17.tgz",
            integrity: "sha512-xQLf0A3HOMlgHq0n247/LRuAOYmB7dXJ/DvAxGvsSBij45XtBSmQycu+F8ODbHwns/XyFZagyL1+J0Offw1E0g==",
          });
          writeFileSync(file, `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Verify clean installation and production audit
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Commit the validated lockfile
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The validated lockfile is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh lockfile for nanoid 3.3.17 [skip ci]"
          git push origin HEAD:agent/p0-02-isolation-closure
