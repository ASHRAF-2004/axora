name: Refresh P0-02 lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: npm

      - name: Apply the verified minimal lockfile patch
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const file = "package-lock.json";
          const lock = JSON.parse(readFileSync(file, "utf8"));
          const entry = lock.packages?.["node_modules/nanoid"];
          if (!entry || entry.version !== "3.3.16") {
            throw new Error(`Unexpected nanoid lock entry: ${entry?.version ?? "missing"}`);
          }
          Object.assign(entry, {
            version: "3.3.17",
            resolved: "https://registry.npmjs.org/nanoid/-/nanoid-3.3.17.tgz",
            integrity: "sha512-xQLf0A3HOMlgHq0n247/LRuAOYmB7dXJ/DvAxGvsSBij45XtBSmQycu+F8ODbHwns/XyFZagyL1+J0Offw1E0g==",
          });
          writeFileSync(file, `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Verify clean installation and production audit
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Publish generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-02-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
