name: Apply approval-limit integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Advance retained migration contracts and remove scaffolding
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in (
              "tests/support-diagnostics-migration.test.ts",
              "tests/account-security-session-audit-migration.test.ts",
          ):
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              old = 'expect(applied.at(-1)).toBe("039_scoped_permission_management.sql");'
              new = 'expect(applied.at(-1)).toBe("040_approval_limit_management.sql");'
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f"Expected migration assertion missing in {filename}")
              path.write_text(source, encoding="utf-8")

          path = Path("tests/full-migration-chain.test.ts")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'it("applies every numbered migration through 039 to an empty database",',
                  'it("applies every numbered migration through 040 to an empty database",',
              ),
              (
                  '''      expect(available.slice(-5)).toEqual([\n        "035_public_visitor_network_uniqueness.sql",\n        "036_authorization_policy_foundation.sql",\n        "037_effective_access_snapshot.sql",\n        "038_canonical_session_scopes.sql",\n        "039_scoped_permission_management.sql",\n      ]);''',
                  '''      expect(available.slice(-5)).toEqual([\n        "036_authorization_policy_foundation.sql",\n        "037_effective_access_snapshot.sql",\n        "038_canonical_session_scopes.sql",\n        "039_scoped_permission_management.sql",\n        "040_approval_limit_management.sql",\n      ]);''',
              ),
              (
                  '''      await db.exec(await readFile(\n        migrationUrl("039_scoped_permission_management.sql"),\n        "utf8",\n      ));''',
                  '''      await db.exec(await readFile(\n        migrationUrl("039_scoped_permission_management.sql"),\n        "utf8",\n      ));\n      await db.exec(await readFile(\n        migrationUrl("040_approval_limit_management.sql"),\n        "utf8",\n      ));''',
              ),
              (
                  'it("keeps reset migration discovery dynamic through 039 while bootstrap retains its 032 minimum",',
                  'it("keeps reset migration discovery dynamic through 040 while bootstrap retains its 032 minimum",',
              ),
              (
                  '038_canonical|039_scoped/',
                  '038_canonical|039_scoped|040_approval/',
              ),
          ]
          for old, new in replacements:
              if old in source:
                  source = source.replace(old, new)
              elif new not in source:
                  raise SystemExit(f"Expected full-chain fragment missing: {old[:80]}")
          path.write_text(source, encoding="utf-8")

          Path(".github/workflows/apply-approval-limit-integration.yml").unlink()
          PY

      - name: Commit and push the clean implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/support-diagnostics-migration.test.ts \
            tests/account-security-session-audit-migration.test.ts \
            tests/full-migration-chain.test.ts \
            .github/workflows/apply-approval-limit-integration.yml
          git commit -m "Advance migration chain through approval limits"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
