name: Patch visitor network privacy notice

on:
  push:
    branches:
      - agent/fix-private-visitor-duplicates
    paths:
      - .github/workflows/patch-visitor-network-privacy-notice.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-private-visitor-duplicates
          fetch-depth: 0
      - name: Add localized network-identifier disclosure and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/lib/i18n.ts';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            [
              '{ title: "Information used", body: "Axora processes account, company, branch, request, quotation, delivery, receiving, invoice, support, security, and audit information required to operate the service." },',
              '{ title: "Information used", body: "Axora processes account, company, branch, request, quotation, delivery, receiving, invoice, support, security, and audit information required to operate the service. The public visitor counter uses the public IP address observed by the server to derive and retain a permanent secret-keyed hash; it does not store the raw IP address. People sharing one public IP share one visitor spot." },',
            ],
            [
              '{ title: "المعلومات المستخدمة", body: "تعالج أكسورا بيانات الحساب والشركة والفرع والطلبات والعروض والتسليم والاستلام والفواتير والدعم والأمان والتدقيق اللازمة لتشغيل الخدمة." },',
              '{ title: "المعلومات المستخدمة", body: "تعالج أكسورا بيانات الحساب والشركة والفرع والطلبات والعروض والتسليم والاستلام والفواتير والدعم والأمان والتدقيق اللازمة لتشغيل الخدمة. يستخدم عداد الزوار العام عنوان IP العام الذي يراه الخادم لاشتقاق بصمة دائمة مشفرة بمفتاح والاحتفاظ بها، ولا يخزن عنوان IP الخام. يشترك الأشخاص الذين يستخدمون عنوان IP عامًا واحدًا في مكان زائر واحد." },',
            ],
            [
              '{ title: "Maklumat yang digunakan", body: "Axora memproses data akaun, syarikat, cawangan, permintaan, sebut harga, penghantaran, penerimaan, invois, sokongan, keselamatan dan audit yang diperlukan." },',
              '{ title: "Maklumat yang digunakan", body: "Axora memproses data akaun, syarikat, cawangan, permintaan, sebut harga, penghantaran, penerimaan, invois, sokongan, keselamatan dan audit yang diperlukan. Kaunter pelawat awam menggunakan alamat IP awam yang dilihat oleh pelayan untuk memperoleh dan menyimpan cincangan berkunci rahsia yang kekal; alamat IP mentah tidak disimpan. Orang yang berkongsi satu alamat IP awam berkongsi satu tempat pelawat." },',
            ],
          ];
          for (const [before, after] of replacements) {
            const matches = source.split(before).length - 1;
            if (matches !== 1) {
              throw new Error(`Expected one exact privacy-notice match, found ${matches}`);
            }
            source = source.replace(before, after);
          }
          fs.writeFileSync(file, source);
          fs.rmSync('.github/workflows/patch-visitor-network-privacy-notice.yml');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/i18n.ts \
            .github/workflows/patch-visitor-network-privacy-notice.yml
          git commit -m "Disclose permanent network identifier in privacy notice"
          git push origin HEAD:agent/fix-private-visitor-duplicates
