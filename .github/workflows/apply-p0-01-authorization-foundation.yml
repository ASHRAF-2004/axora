          -- Department is introduced here only as the minimum stable scope object needed
          -- by the authorization model. P1-02 extends its operational attributes.
          CREATE TABLE IF NOT EXISTS departments (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            company_id uuid NOT NULL REFERENCES companies(id) ON DELETE RESTRICT,
            branch_id uuid,
            department_code text NOT NULL
              CHECK (char_length(btrim(department_code)) BETWEEN 1 AND 40),
            name text NOT NULL CHECK (char_length(btrim(name)) BETWEEN 2 AND 200),
            active boolean NOT NULL DEFAULT true,
            created_by uuid REFERENCES users(id) ON DELETE SET NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now(),
            FOREIGN KEY(branch_id,company_id)
              REFERENCES branches(id,company_id) ON DELETE RESTRICT,
            UNIQUE(id,company_id),
            UNIQUE(company_id,department_code)
          );
          CREATE UNIQUE INDEX IF NOT EXISTS departments_company_name_lower_uq
            ON departments(company_id,lower(name));

          CREATE TABLE IF NOT EXISTS department_assignments (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            company_id uuid NOT NULL REFERENCES companies(id) ON DELETE RESTRICT,
            department_id uuid NOT NULL,
            status text NOT NULL DEFAULT 'ACTIVE'
              CHECK (status IN ('ACTIVE','SUSPENDED','ENDED')),
            is_primary boolean NOT NULL DEFAULT false,
            assigned_by uuid REFERENCES users(id) ON DELETE SET NULL,
            assigned_at timestamptz NOT NULL DEFAULT now(),
            ended_at timestamptz,
            FOREIGN KEY(department_id,company_id)
              REFERENCES departments(id,company_id) ON DELETE RESTRICT,
            CHECK (
              (status='ENDED' AND ended_at IS NOT NULL)
              OR (status<>'ENDED' AND ended_at IS NULL)
            )
          );
          CREATE UNIQUE INDEX IF NOT EXISTS department_assignments_active_uq
            ON department_assignments(user_id,department_id)
            WHERE status='ACTIVE';
          CREATE UNIQUE INDEX IF NOT EXISTS department_assignments_one_primary_uq
            ON department_assignments(user_id)
            WHERE status='ACTIVE' AND is_primary;

          CREATE TABLE IF NOT EXISTS user_scopes (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            scope_type text NOT NULL
              CHECK (scope_type IN (
                'PLATFORM','COMPANY','BRANCH','DEPARTMENT','SUPPLIER','DELIVERY'
              )),
            company_id uuid REFERENCES companies(id) ON DELETE RESTRICT,
            branch_id uuid,
            department_id uuid,
            supplier_id uuid REFERENCES suppliers(id) ON DELETE RESTRICT,
            source text NOT NULL
              CHECK (source IN (
                'ROLE_ASSIGNMENT','DIRECT','DELEGATION','BACKUP_ASSIGNMENT'
              )),
            source_reference uuid,
            starts_at timestamptz NOT NULL DEFAULT now(),
            ends_at timestamptz,
            active boolean NOT NULL DEFAULT true,
            assigned_by uuid REFERENCES users(id) ON DELETE SET NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            FOREIGN KEY(branch_id,company_id)
              REFERENCES branches(id,company_id) ON DELETE RESTRICT,
            FOREIGN KEY(department_id,company_id)
              REFERENCES departments(id,company_id) ON DELETE RESTRICT,
            CHECK (ends_at IS NULL OR ends_at > starts_at),
            CHECK (
              (scope_type='PLATFORM'
                AND company_id IS NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NULL)
              OR
              (scope_type='COMPANY'
                AND company_id IS NOT NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NULL)
              OR
              (scope_type='BRANCH'
                AND company_id IS NOT NULL AND branch_id IS NOT NULL
                AND department_id IS NULL AND supplier_id IS NULL)
              OR
              (scope_type='DEPARTMENT'
                AND company_id IS NOT NULL AND department_id IS NOT NULL
                AND supplier_id IS NULL)
              OR
              (scope_type='SUPPLIER'
                AND company_id IS NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NOT NULL)
              OR
              (scope_type='DELIVERY'
                AND company_id IS NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NULL)
            )
          );
          CREATE UNIQUE INDEX IF NOT EXISTS user_scopes_active_identity_uq
            ON user_scopes(
              user_id,scope_type,
              COALESCE(company_id,'00000000-0000-0000-0000-000000000000'::uuid),
              COALESCE(branch_id,'00000000-0000-0000-0000-000000000000'::uuid),
              COALESCE(department_id,'00000000-0000-0000-0000-000000000000'::uuid),
              COALESCE(supplier_id,'00000000-0000-0000-0000-000000000000'::uuid),
              source,
              COALESCE(source_reference,'00000000-0000-0000-0000-000000000000'::uuid)
            ) WHERE active;

          INSERT INTO user_scopes(
            user_id,scope_type,company_id,branch_id,supplier_id,
            source,source_reference,starts_at,ends_at,active,assigned_by
          )
          SELECT
            assignment.user_id,assignment.scope_type,assignment.company_id,
            assignment.branch_id,assignment.supplier_id,
            'ROLE_ASSIGNMENT',assignment.id,assignment.assigned_at,
            assignment.revoked_at,assignment.active,assignment.assigned_by
          FROM role_assignments assignment
          ON CONFLICT DO NOTHING;

          CREATE TABLE IF NOT EXISTS user_permission_overrides (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            permission_id uuid NOT NULL REFERENCES permissions(id) ON DELETE RESTRICT,
            effect text NOT NULL CHECK (effect IN ('GRANT','DENY')),
            scope_type text NOT NULL
              CHECK (scope_type IN (
                'PLATFORM','COMPANY','BRANCH','DEPARTMENT','SUPPLIER','DELIVERY'
              )),
            company_id uuid REFERENCES companies(id) ON DELETE RESTRICT,
            branch_id uuid,
            department_id uuid,
            supplier_id uuid REFERENCES suppliers(id) ON DELETE RESTRICT,
            starts_at timestamptz NOT NULL DEFAULT now(),
            ends_at timestamptz,
            active boolean NOT NULL DEFAULT true,
            reason text NOT NULL CHECK (char_length(btrim(reason)) BETWEEN 3 AND 500),
            changed_by uuid NOT NULL REFERENCES users(id) ON DELETE RESTRICT,
            created_at timestamptz NOT NULL DEFAULT now(),
            FOREIGN KEY(branch_id,company_id)
              REFERENCES branches(id,company_id) ON DELETE RESTRICT,
            FOREIGN KEY(department_id,company_id)
              REFERENCES departments(id,company_id) ON DELETE RESTRICT,
            CHECK (ends_at IS NULL OR ends_at > starts_at),
            CHECK (
              (scope_type='PLATFORM'
                AND company_id IS NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NULL)
              OR
              (scope_type='COMPANY'
                AND company_id IS NOT NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NULL)
              OR
              (scope_type='BRANCH'
                AND company_id IS NOT NULL AND branch_id IS NOT NULL
                AND department_id IS NULL AND supplier_id IS NULL)
              OR
              (scope_type='DEPARTMENT'
                AND company_id IS NOT NULL AND department_id IS NOT NULL
                AND supplier_id IS NULL)
              OR
              (scope_type='SUPPLIER'
                AND company_id IS NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NOT NULL)
              OR
              (scope_type='DELIVERY'
                AND company_id IS NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NULL)
            )
          );
          CREATE INDEX IF NOT EXISTS user_permission_overrides_lookup_idx
            ON user_permission_overrides(user_id,permission_id,active,starts_at,ends_at);

          CREATE TABLE IF NOT EXISTS approval_limits (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid REFERENCES users(id) ON DELETE CASCADE,
            role_id uuid REFERENCES roles(id) ON DELETE CASCADE,
            permission_id uuid NOT NULL REFERENCES permissions(id) ON DELETE RESTRICT,
            scope_type text NOT NULL
              CHECK (scope_type IN ('COMPANY','BRANCH','DEPARTMENT')),
            company_id uuid NOT NULL REFERENCES companies(id) ON DELETE RESTRICT,
            branch_id uuid,
            department_id uuid,
            currency text NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),
            maximum_amount numeric(18,2) NOT NULL CHECK (maximum_amount >= 0),
            allow_self_approval boolean NOT NULL DEFAULT false,
            starts_at timestamptz NOT NULL DEFAULT now(),
            ends_at timestamptz,
            active boolean NOT NULL DEFAULT true,
            reason text NOT NULL CHECK (char_length(btrim(reason)) BETWEEN 3 AND 500),
            changed_by uuid NOT NULL REFERENCES users(id) ON DELETE RESTRICT,
            created_at timestamptz NOT NULL DEFAULT now(),
            FOREIGN KEY(branch_id,company_id)
              REFERENCES branches(id,company_id) ON DELETE RESTRICT,
            FOREIGN KEY(department_id,company_id)
              REFERENCES departments(id,company_id) ON DELETE RESTRICT,
            CHECK ((user_id IS NOT NULL) <> (role_id IS NOT NULL)),
            CHECK (ends_at IS NULL OR ends_at > starts_at),
            CHECK (
              (scope_type='COMPANY' AND branch_id IS NULL AND department_id IS NULL)
              OR
              (scope_type='BRANCH' AND branch_id IS NOT NULL AND department_id IS NULL)
              OR
              (scope_type='DEPARTMENT' AND department_id IS NOT NULL)
            )
          );
          CREATE INDEX IF NOT EXISTS approval_limits_subject_lookup_idx
            ON approval_limits(user_id,role_id,permission_id,active,starts_at,ends_at);

          CREATE TABLE IF NOT EXISTS delegated_access (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            grantee_user_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            authorized_by uuid NOT NULL REFERENCES users(id) ON DELETE RESTRICT,
            starts_at timestamptz NOT NULL,
            ends_at timestamptz NOT NULL,
            status text NOT NULL DEFAULT 'ACTIVE'
              CHECK (status IN ('ACTIVE','REVOKED','EXPIRED')),
            reason text NOT NULL CHECK (char_length(btrim(reason)) BETWEEN 3 AND 500),
            revoked_at timestamptz,
            revoked_by uuid REFERENCES users(id) ON DELETE RESTRICT,
            created_at timestamptz NOT NULL DEFAULT now(),
            CHECK (ends_at > starts_at),
            CHECK (
              (status='REVOKED' AND revoked_at IS NOT NULL AND revoked_by IS NOT NULL)
              OR (status<>'REVOKED' AND revoked_at IS NULL AND revoked_by IS NULL)
            )
          );

          CREATE TABLE IF NOT EXISTS delegated_access_permissions (
            delegated_access_id uuid NOT NULL
              REFERENCES delegated_access(id) ON DELETE CASCADE,
            permission_id uuid NOT NULL REFERENCES permissions(id) ON DELETE RESTRICT,
            PRIMARY KEY(delegated_access_id,permission_id)
          );

          CREATE TABLE IF NOT EXISTS delegated_access_scopes (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            delegated_access_id uuid NOT NULL
              REFERENCES delegated_access(id) ON DELETE CASCADE,
            scope_type text NOT NULL
              CHECK (scope_type IN (
                'PLATFORM','COMPANY','BRANCH','DEPARTMENT','SUPPLIER','DELIVERY'
              )),
            company_id uuid REFERENCES companies(id) ON DELETE RESTRICT,
            branch_id uuid,
            department_id uuid,
            supplier_id uuid REFERENCES suppliers(id) ON DELETE RESTRICT,
            FOREIGN KEY(branch_id,company_id)
              REFERENCES branches(id,company_id) ON DELETE RESTRICT,
            FOREIGN KEY(department_id,company_id)
              REFERENCES departments(id,company_id) ON DELETE RESTRICT,
            CHECK (
              (scope_type='PLATFORM'
                AND company_id IS NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NULL)
              OR
              (scope_type='COMPANY'
                AND company_id IS NOT NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NULL)
              OR
              (scope_type='BRANCH'
                AND company_id IS NOT NULL AND branch_id IS NOT NULL
                AND department_id IS NULL AND supplier_id IS NULL)
              OR
              (scope_type='DEPARTMENT'
                AND company_id IS NOT NULL AND department_id IS NOT NULL
                AND supplier_id IS NULL)
              OR
              (scope_type='SUPPLIER'
                AND company_id IS NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NOT NULL)
              OR
              (scope_type='DELIVERY'
                AND company_id IS NULL AND branch_id IS NULL
                AND department_id IS NULL AND supplier_id IS NULL)
            )
          );

          CREATE TABLE IF NOT EXISTS permission_change_history (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            actor_user_id uuid NOT NULL REFERENCES users(id) ON DELETE RESTRICT,
            target_user_id uuid REFERENCES users(id) ON DELETE RESTRICT,
            target_role_id uuid REFERENCES roles(id) ON DELETE RESTRICT,
            permission_id uuid REFERENCES permissions(id) ON DELETE RESTRICT,
            change_type text NOT NULL CHECK (change_type IN (
              'ROLE_ASSIGNED','ROLE_REVOKED','SCOPE_GRANTED','SCOPE_REVOKED',
              'PERMISSION_GRANTED','PERMISSION_DENIED','PERMISSION_REMOVED',
              'APPROVAL_LIMIT_SET','APPROVAL_LIMIT_REMOVED',
              'DELEGATION_CREATED','DELEGATION_REVOKED'
            )),
            previous_value jsonb,
            new_value jsonb,
            reason text NOT NULL CHECK (char_length(btrim(reason)) BETWEEN 3 AND 500),
            correlation_id uuid NOT NULL DEFAULT gen_random_uuid(),
            occurred_at timestamptz NOT NULL DEFAULT now(),
            CHECK (
              (target_user_id IS NOT NULL AND target_role_id IS NULL)
              OR (target_user_id IS NULL AND target_role_id IS NOT NULL)
            ),
            CHECK (previous_value IS NOT NULL OR new_value IS NOT NULL)
          );

          CREATE OR REPLACE FUNCTION reject_permission_change_history_mutation()
          RETURNS trigger
          LANGUAGE plpgsql
          SECURITY DEFINER
          SET search_path = pg_catalog,public,pg_temp
          AS $$
          BEGIN
            RAISE EXCEPTION 'Permission change history is append-only';
          END $$;
          REVOKE ALL ON FUNCTION reject_permission_change_history_mutation()
            FROM PUBLIC;

          DROP TRIGGER IF EXISTS reject_permission_change_history_update
            ON permission_change_history;
          CREATE TRIGGER reject_permission_change_history_update
          BEFORE UPDATE OR DELETE ON permission_change_history
          FOR EACH ROW EXECUTE FUNCTION reject_permission_change_history_mutation();

          REVOKE ALL ON TABLE
            permissions,role_permissions,departments,department_assignments,
            user_scopes,user_permission_overrides,approval_limits,
            delegated_access,delegated_access_permissions,delegated_access_scopes,
            permission_change_history
          FROM PUBLIC;

          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname='axora_app') THEN
              GRANT SELECT ON permissions,role_permissions TO axora_app;
            END IF;
          END $$;

          COMMIT;
          """,
              "tests/authorization-policy.test.ts": """import { describe, expect, it } from "vitest";
          import {
            authorize,
            defaultPermissionsForRole,
            isPermissionCode,
            type ApprovalLimit,
            type AuthorizationScope,
            type AuthorizationSubject,
          } from "@/lib/authorization-policy";

          const company = (companyId = "company-a"): AuthorizationScope => ({
            type: "COMPANY",
            companyId,
          });

          function subject(
            overrides: Partial<AuthorizationSubject> = {},
          ): AuthorizationSubject {
            return {
              userId: "user-1",
              role: "COMPANY_APPROVER",
              accountKind: "COMPANY",
              accountStatus: "ACTIVE",
              isOwner: false,
              scopes: [company()],
              approvalLimits: [{
                permission: "request.approve.other",
                currency: "MYR",
                maximumAmount: 2_000,
                allowSelfApproval: false,
                active: true,
                scope: company(),
              }],
              ...overrides,
            };
          }

          function approve(
            actor: AuthorizationSubject,
            overrides: Partial<{
              ownerUserId: string;
              amount: number;
              currency: string;
              availableBudget: number;
              companyCeilingRemaining: number;
              stateAllowsAction: boolean;
              scope: AuthorizationScope;
            }> = {},
          ) {
            return authorize({
              subject: actor,
              permission: "request.approve.other",
              resource: {
                scope: overrides.scope ?? company(),
                ownerUserId: overrides.ownerUserId ?? "requester-2",
                amount: overrides.amount ?? 1_000,
                currency: overrides.currency ?? "MYR",
                availableBudget: overrides.availableBudget ?? 5_000,
                companyCeilingRemaining: overrides.companyCeilingRemaining ?? 10_000,
                stateAllowsAction: overrides.stateAllowsAction ?? true,
              },
            });
          }

          describe("P0-01 authorization policy", () => {
            it("exposes stable dot-delimited permission codes and role defaults", () => {
              expect(isPermissionCode("request.approve.other")).toBe(true);
              expect(isPermissionCode("request_approve_other")).toBe(false);
              expect(defaultPermissionsForRole("REQUESTER", "BRANCH")).toContain(
                "request.create",
              );
              expect(defaultPermissionsForRole("REQUESTER", "BRANCH")).not.toContain(
                "request.approve.other",
              );
              expect(defaultPermissionsForRole(
                "CLIENT_ACCOUNT_MANAGER",
                "COMPANY",
              )).toContain("company.view.assigned");
            });

            it("fails closed for inactive, unknown, malformed, and cross-company subjects", () => {
              expect(approve(subject({ accountStatus: "SUSPENDED" }))).toMatchObject({
                allowed: false,
                reason: "ACCOUNT_INACTIVE",
              });
              expect(approve(subject({ role: "FORGED_ROOT" }))).toMatchObject({
                allowed: false,
                reason: "ROLE_INVALID",
              });
              expect(approve(subject({
                scopes: [{ type: "COMPANY" }],
              }))).toMatchObject({
                allowed: false,
                reason: "SCOPE_INVALID",
              });
              expect(approve(subject(), {
                scope: company("company-b"),
              })).toMatchObject({
                allowed: false,
                reason: "RESOURCE_OUT_OF_SCOPE",
              });
            });

            it("requires independent self-approval permission and a self-enabled limit", () => {
              expect(approve(subject(), { ownerUserId: "user-1" })).toMatchObject({
                allowed: false,
                permission: "request.approve.self",
                reason: "SELF_APPROVAL_DENIED",
              });

              const selfLimit: ApprovalLimit = {
                permission: "request.approve.self",
                currency: "MYR",
                maximumAmount: 500,
                allowSelfApproval: true,
                active: true,
                scope: company(),
              };
              const selfApprover = subject({
                explicitGrants: ["request.approve.self"],
                approvalLimits: [selfLimit],
              });
              expect(approve(selfApprover, {
                ownerUserId: "user-1",
                amount: 500,
              })).toMatchObject({
                allowed: true,
                permission: "request.approve.self",
                source: "EXPLICIT_GRANT",
              });
              expect(approve(selfApprover, {
                ownerUserId: "user-1",
                amount: 500.01,
              })).toMatchObject({
                allowed: false,
                reason: "APPROVAL_LIMIT_EXCEEDED",
              });
            });

            it("enforces currency, approval limit, budget, ceiling, and entity state", () => {
              expect(approve(subject(), { currency: "USD" })).toMatchObject({
                allowed: false,
                reason: "CURRENCY_MISMATCH",
              });
              expect(approve(subject(), { amount: 2_001 })).toMatchObject({
                allowed: false,
                reason: "APPROVAL_LIMIT_EXCEEDED",
              });
              expect(approve(subject(), {
                amount: 1_500,
                availableBudget: 1_000,
              })).toMatchObject({
                allowed: false,
                reason: "BUDGET_INSUFFICIENT",
              });
              expect(approve(subject({
                explicitGrants: ["request.approve.over_budget"],
              }), {
                amount: 1_500,
                availableBudget: 1_000,
              })).toMatchObject({ allowed: true });
              expect(approve(subject(), {
                companyCeilingRemaining: 500,
              })).toMatchObject({
                allowed: false,
                reason: "COMPANY_CEILING_EXCEEDED",
              });
              expect(approve(subject(), {
                stateAllowsAction: false,
              })).toMatchObject({
                allowed: false,
                reason: "INVALID_RESOURCE_STATE",
              });
            });

            it("gives explicit denial precedence over role and delegation grants", () => {
              const now = new Date("2026-08-06T04:00:00.000Z");
              const delegated = subject({
                role: "AUDITOR",
                explicitDenies: ["request.approve.other"],
                delegations: [{
                  active: true,
                  startsAt: new Date("2026-08-06T03:00:00.000Z"),
                  endsAt: new Date("2026-08-06T05:00:00.000Z"),
                  permissions: ["request.approve.other"],
                  scopes: [company()],
                }],
              });
              expect(authorize({
                subject: delegated,
                permission: "request.approve.other",
                resource: {
                  scope: company(),
                  amount: 100,
                  currency: "MYR",
                  availableBudget: 1_000,
                  companyCeilingRemaining: 1_000,
                },
                now,
              })).toMatchObject({
                allowed: false,
                reason: "PERMISSION_DENIED",
              });
            });

            it("uses only active, unexpired, scoped delegations", () => {
              const now = new Date("2026-08-06T04:00:00.000Z");
              const limit: ApprovalLimit = {
                permission: "request.approve.other",
                currency: "MYR",
                maximumAmount: 1_000,
                allowSelfApproval: false,
                active: true,
                scope: company(),
              };
              const auditor = subject({
                role: "AUDITOR",
                approvalLimits: [limit],
                delegations: [{
                  active: true,
                  startsAt: new Date("2026-08-06T03:00:00.000Z"),
                  endsAt: new Date("2026-08-06T05:00:00.000Z"),
                  permissions: ["request.approve.other"],
                  scopes: [company()],
                }],
              });
              expect(authorize({
                subject: auditor,
                permission: "request.approve.other",
                resource: {
                  scope: company(),
                  amount: 500,
                  currency: "MYR",
                  availableBudget: 1_000,
                  companyCeilingRemaining: 1_000,
                },
                now,
              })).toMatchObject({
                allowed: true,
                source: "DELEGATION",
              });

              expect(authorize({
                subject: {
                  ...auditor,
                  delegations: [{
                    ...auditor.delegations![0],
                    endsAt: new Date("2026-08-06T03:59:59.000Z"),
                  }],
                },
                permission: "request.approve.other",
                resource: { scope: company() },
                now,
              })).toMatchObject({
                allowed: false,
                reason: "PERMISSION_DENIED",
              });
            });

            it("supports branch, department, supplier, and delivery assignment scopes", () => {
              const departmentAdmin = subject({
                role: "DEPARTMENT_ADMIN",
                scopes: [{
                  type: "DEPARTMENT",
                  companyId: "company-a",
                  branchId: "branch-a",
                  departmentId: "department-a",
                }],
                approvalLimits: [],
              });
              expect(authorize({
                subject: departmentAdmin,
                permission: "request.create",
                resource: {
                  scope: {
                    type: "DEPARTMENT",
                    companyId: "company-a",
                    branchId: "branch-a",
                    departmentId: "department-a",
                  },
                },
              })).toMatchObject({ allowed: true, source: "ROLE" });
              expect(authorize({
                subject: departmentAdmin,
                permission: "request.create",
                resource: {
                  scope: {
                    type: "DEPARTMENT",
                    companyId: "company-a",
                    departmentId: "department-b",
                  },
                },
              })).toMatchObject({
                allowed: false,
                reason: "RESOURCE_OUT_OF_SCOPE",
              });

              const deliveryAgent = subject({
                role: "DELIVERY_AGENT",
                accountKind: "DELIVERY",
                scopes: [{
                  type: "DELIVERY",
                  deliveryAssignmentId: "delivery-a",
                }],
                approvalLimits: [],
              });
              expect(authorize({
                subject: deliveryAgent,
                permission: "delivery.assignment.update",
                resource: {
                  scope: {
                    type: "DELIVERY",
                    deliveryAssignmentId: "delivery-b",
                  },
                },
              })).toMatchObject({
                allowed: false,
                reason: "RESOURCE_OUT_OF_SCOPE",
              });
            });
          });
          """,
              "tests/authorization-foundation-migration.test.ts": """import { PGlite } from "@electric-sql/pglite";
          import { readFile } from "node:fs/promises";
          import { describe, expect, it } from "vitest";
          import { PERMISSION_CATALOG } from "@/lib/authorization-policy";
          import {
            applyDemoSeed,
            applyMigrations,
          } from "./helpers/pglite";

          const migration036Url = new URL(
            "../database/migrations/036_authorization_policy_foundation.sql",
            import.meta.url,
          );

          describe("P0-01 authorization policy foundation migration", () => {
            it("installs the canonical role and permission catalogue on a fresh schema", async () => {
              const db = new PGlite();
              try {
                const applied = await applyMigrations(db);
                expect(applied.at(-1)).toBe(
                  "036_authorization_policy_foundation.sql",
                );

                const roles = await db.query<{ roleKey: string }>(`
                  SELECT role_key AS "roleKey"
                  FROM roles
                  WHERE role_key IN (
                    'CLIENT_ACCOUNT_MANAGER',
                    'DEPARTMENT_ADMIN',
                    'DELIVERY_TEAM_SUPERVISOR',
                    'DELIVERY_AGENT'
                  )
                  ORDER BY role_key
                `);
                expect(roles.rows.map((row) => row.roleKey)).toEqual([
                  "CLIENT_ACCOUNT_MANAGER",
                  "DELIVERY_AGENT",
                  "DELIVERY_TEAM_SUPERVISOR",
                  "DEPARTMENT_ADMIN",
                ].sort());

                const permissions = await db.query<{ code: string }>(`
                  SELECT permission_code AS code
                  FROM permissions
                  ORDER BY permission_code
                `);
                expect(permissions.rows.map((row) => row.code)).toEqual(
                  PERMISSION_CATALOG.map((entry) => entry.code).sort(),
                );

                const defaults = await db.query<{
                  roleKey: string;
                  permissionCode: string;
                }>(`
                  SELECT role.role_key AS "roleKey",
                         permission.permission_code AS "permissionCode"
                  FROM role_permissions default_permission
                  JOIN roles role ON role.id=default_permission.role_id
                  JOIN permissions permission
                    ON permission.id=default_permission.permission_id
                  WHERE (
                    role.role_key='CLIENT_ACCOUNT_MANAGER'
                    AND permission.permission_code='company.view.assigned'
                  ) OR (
                    role.role_key='DEPARTMENT_ADMIN'
                    AND permission.permission_code='request.create'
                  ) OR (
                    role.role_key='DELIVERY_TEAM_SUPERVISOR'
                    AND permission.permission_code='delivery.assign'
                  ) OR (
                    role.role_key='DELIVERY_AGENT'
                    AND permission.permission_code='delivery.assignment.update'
                  )
                  ORDER BY role.role_key
                `);
                expect(defaults.rows).toHaveLength(4);
              } finally {
                await db.close();
              }
            }, 30_000);

            it("upgrades a populated migration-035 database without changing existing identities", async () => {
              const db = new PGlite();
              try {
                await applyMigrations(db, {
                  through: "035_public_visitor_network_uniqueness.sql",
                });
                await applyDemoSeed(db);

                const before = await db.query<{
                  users: number;
                  assignments: number;
                  companies: number;
                }>(`
                  SELECT
                    (SELECT count(*)::int FROM users) AS users,
                    (SELECT count(*)::int FROM role_assignments) AS assignments,
                    (SELECT count(*)::int FROM companies) AS companies
                `);

                await db.exec(await readFile(migration036Url, "utf8"));

                const after = await db.query<{
                  users: number;
                  assignments: number;
                  companies: number;
                  scopes: number;
                }>(`
                  SELECT
                    (SELECT count(*)::int FROM users) AS users,
                    (SELECT count(*)::int FROM role_assignments) AS assignments,
                    (SELECT count(*)::int FROM companies) AS companies,
                    (SELECT count(*)::int FROM user_scopes
                      WHERE source='ROLE_ASSIGNMENT') AS scopes
                `);
                expect(after.rows[0]).toMatchObject(before.rows[0]);
                expect(after.rows[0].scopes).toBe(before.rows[0].assignments);
              } finally {
                await db.close();
              }
            }, 30_000);

            it("enforces typed scopes, approval subjects, delegation expiry, and append-only history", async () => {
              const db = new PGlite();
              try {
                await applyMigrations(db);
                await applyDemoSeed(db);

                const fixture = await db.query<{
                  actorId: string;
                  companyId: string;
                  branchId: string;
                  companyAdminRoleId: string;
                  approvePermissionId: string;
                }>(`
                  SELECT
                    (SELECT id::text FROM users ORDER BY is_owner DESC,id LIMIT 1)
                      AS "actorId",
                    selected.company_id::text AS "companyId",
                    selected.id::text AS "branchId",
                    (SELECT id::text FROM roles
                      WHERE role_key='COMPANY_ADMIN') AS "companyAdminRoleId",
                    (SELECT id::text FROM permissions
                      WHERE permission_code='request.approve.other')
                      AS "approvePermissionId"
                  FROM (
                    SELECT id,company_id
                    FROM branches
                    ORDER BY id
                    LIMIT 1
                  ) selected
                `);
                const value = fixture.rows[0];

                const department = await db.query<{ id: string }>(`
                  INSERT INTO departments(
                    company_id,branch_id,department_code,name,created_by
                  ) VALUES ($1,$2,'HR','Human Resources',$3)
                  RETURNING id::text
                `, [value.companyId, value.branchId, value.actorId]);
                const departmentId = department.rows[0].id;

                await expect(db.query(`
                  INSERT INTO user_scopes(
                    user_id,scope_type,company_id,source,assigned_by
                  ) VALUES ($1,'DEPARTMENT',$2,'DIRECT',$1)
                `, [value.actorId, value.companyId]))
                  .rejects.toThrow();

                await expect(db.query(`
                  INSERT INTO user_scopes(
                    user_id,scope_type,company_id,branch_id,department_id,
                    source,assigned_by
                  ) VALUES ($1,'DEPARTMENT',$2,$3,$4,'DIRECT',$1)
                `, [
                  value.actorId,
                  value.companyId,
                  value.branchId,
                  departmentId,
                ])).resolves.not.toThrow();

                await expect(db.query(`
                  INSERT INTO approval_limits(
                    user_id,role_id,permission_id,scope_type,company_id,
                    currency,maximum_amount,reason,changed_by
                  ) VALUES ($1,$2,$3,'COMPANY',$4,'MYR',1000,
                    'Invalid dual subject',$1)
                `, [
                  value.actorId,
                  value.companyAdminRoleId,
                  value.approvePermissionId,
                  value.companyId,
                ])).rejects.toThrow();

                await expect(db.query(`
                  INSERT INTO approval_limits(
                    role_id,permission_id,scope_type,company_id,
                    currency,maximum_amount,reason,changed_by
                  ) VALUES ($1,$2,'COMPANY',$3,'MYR',1000,
                    'Company approval policy',$4)
                `, [
                  value.companyAdminRoleId,
                  value.approvePermissionId,
                  value.companyId,
                  value.actorId,
                ])).resolves.not.toThrow();

                const delegation = await db.query<{ id: string }>(`
                  INSERT INTO delegated_access(
                    grantee_user_id,authorized_by,starts_at,ends_at,reason
                  ) VALUES (
                    $1,$1,now(),now()+interval '1 hour',
                    'Temporary approved coverage'
                  )
                  RETURNING id::text
                `, [value.actorId]);
                await db.query(`
                  INSERT INTO delegated_access_permissions(
                    delegated_access_id,permission_id
                  ) VALUES ($1,$2)
                `, [delegation.rows[0].id, value.approvePermissionId]);
                await db.query(`
                  INSERT INTO delegated_access_scopes(
                    delegated_access_id,scope_type,company_id
                  ) VALUES ($1,'COMPANY',$2)
                `, [delegation.rows[0].id, value.companyId]);

                const history = await db.query<{ id: string }>(`
                  INSERT INTO permission_change_history(
                    actor_user_id,target_user_id,permission_id,change_type,
                    new_value,reason
                  ) VALUES (
                    $1,$1,$2,'PERMISSION_GRANTED',
                    '{"effect":"GRANT"}'::jsonb,
                    'Authorization foundation test'
                  )
                  RETURNING id::text
                `, [value.actorId, value.approvePermissionId]);
                await expect(db.query(`
                  UPDATE permission_change_history
                  SET reason='tampered'
                  WHERE id=$1
                `, [history.rows[0].id])).rejects.toThrow(/append-only/i);
                await expect(db.query(`
                  DELETE FROM permission_change_history WHERE id=$1
                `, [history.rows[0].id])).rejects.toThrow(/append-only/i);
              } finally {
                await db.close();
              }
            }, 30_000);
          });
          """,
              "docs/refactor/AUTHORIZATION_POLICY.md": """# Axora P0-01 authorization policy foundation

          Status: implemented as an expand-compatible foundation. Existing production
          routes continue using `src/lib/permissions.ts` while domain services move to
          `src/lib/authorization-policy.ts` in controlled follow-up slices.

          ## Decision rule

          Effective access is never a role-name check. The policy result is the
          intersection of:

          ```text
          active account
          + canonical role
          + account kind
          + active scope
          + permission default
          + explicit grant or deny
          + active delegated authority
          + approval limit and currency
          + self-approval rule
          + budget availability
          + company contractual ceiling
          + resource ownership and current state
          ```

          Explicit denial wins over every grant source. Unknown roles, malformed scopes,
          inactive accounts, stale entity states, missing approval limits, and
          out-of-scope resources fail closed.

          ## Canonical responsibility hierarchy

          ```mermaid
          flowchart TB
            owner[Platform Owner]
            cam[Client Account Manager]
            company[Company Administrator]
            branch[Branch Administrator]
            department[Department Administrator]
            requester[Requester / Purchasing Assistant]
            deliverySupervisor[Delivery Team Supervisor]
            deliveryAgent[Delivery Agent]

            owner --> cam
            cam --> company
            company --> branch
            company --> department
            branch --> requester
            department --> requester
            owner --> deliverySupervisor
            deliverySupervisor --> deliveryAgent
          ```

          The arrows express management responsibility, not automatic inheritance of
          every permission. A Client Account Manager is a platform employee but receives
          company scopes only for companies explicitly assigned to them.

          ## Stable permission catalogue

          Migration 036 and `PERMISSION_CATALOG` introduce dot-delimited machine codes.
          The catalogue covers:

          - company leads, assignment, lifecycle, portal preview/publication;
          - users, invitations, explicit permissions, and deactivation;
          - branches, departments, cost centres, and delivery locations;
          - catalogue, supplier, sourcing, carts, and purchase requests;
          - other-user approval, self-approval, over-budget approval, and actual-cost
            approval as separate capabilities;
          - budget allocation, increase, reduction, refresh, and correction;
          - internal cost, markup, company ceiling, and platform margin as independent
            confidential capabilities;
          - delivery supervision and assigned-agent actions;
          - receiving, finance, documents, analytics, email operations, audit, settings,
            and constrained diagnostics.

          Role defaults are bootstrap policy, not the complete authorization answer.
          Explicit grants and denials remain scoped and time-bounded.

          ## Scope model

          | Scope | Required identity | Resource boundary |
          | --- | --- | --- |
          | `PLATFORM` | Platform account | Platform-wide only where the permission permits |
          | `COMPANY` | Explicit company scope | One company and permitted descendants |
          | `BRANCH` | Company + branch | One branch in one company |
          | `DEPARTMENT` | Company + department, optional parent branch | One department |
          | `SUPPLIER` | Supplier membership | One supplier organization |
          | `DELIVERY` | Delivery account/team or assignment | Delivery work assigned to the team/agent |

          Migration 036 backfills existing `role_assignments` into `user_scopes` without
          changing the active identity used by the current production release.

          ## Approval boundary

          The policy resolves a self-owned request from `request.approve.other` to the
          separate `request.approve.self` capability. Self-approval therefore requires:

          1. an explicit self-approval grant;
          2. an active limit that permits self-approval;
          3. matching scope and currency;
          4. amount at or below the limit;
          5. sufficient budget or an independent over-budget capability;
          6. sufficient company ceiling or an authorized Axora ceiling exception; and
          7. a workflow state that permits approval.

          Job title is deliberately absent from every policy input.

          ## Database primitives

          Migration 036 adds:

          - `permissions` and `role_permissions`;
          - minimal `departments` and `department_assignments` scope records;
          - `user_scopes`;
          - scoped `user_permission_overrides` with explicit `GRANT`/`DENY`;
          - user- or role-based `approval_limits`;
          - time-bounded `delegated_access`, its permissions, and scopes;
          - append-only `permission_change_history`.

          The application role can read the immutable permission catalogue/defaults but
          does not receive direct mutation rights to these policy tables. Later admin
          commands must use narrow, audited database/domain capabilities.

          ## Compatibility and rollout

          New roles that require assignment/session integration are present in the
          catalogue but intentionally excluded from the existing account-creation UI.
          This avoids creating an account that the current live session resolver cannot
          yet authorize. Follow-up P0-01 slices will add audited management commands,
          effective-access read models, session integration for multi-scope users, and
          the administration UI before those role choices are enabled.

          No production database reset is required for this foundation. The migration is
          forward-only, additive, and preserves existing users, assignments, sessions,
          and historical actions.
          """,
