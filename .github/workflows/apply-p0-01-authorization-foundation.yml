name: Apply P0-01 authorization foundation

on:
  push:
    branches:
      - agent/p0-01-authorization-foundation
    paths:
      - .github/workflows/apply-p0-01-authorization-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply generated authorization foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/p0-01-authorization-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed P0-01 files and patches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one match, found {count} for {old[:80]!r}"
                  )
              target.write_text(source.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              source = target.read_text()
              updated, count = re.subn(
                  pattern,
                  replacement,
                  source,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one regex match, found {count} for {pattern!r}"
                  )
              target.write_text(updated)

