name: Apply P0-01 authorization foundation

on:
  push:
    branches:
      - agent/p0-01-authorization-foundation
    paths:
      - .github/workflows/apply-p0-01-authorization-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply authorization foundation payload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/p0-01-authorization-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Extract and apply reviewed payload
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .tmp/p0-01-payload.part* | base64 --decode | tar -xzf -
          python3 .tmp/apply-p0-01.py
          rm -rf .tmp

      - name: Validate implementation shape
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -f database/migrations/036_authorization_policy_foundation.sql
          test -f src/lib/authorization-policy.ts
          test -f tests/authorization-policy.test.ts
          test -f tests/authorization-foundation-migration.test.ts
          test -f docs/refactor/AUTHORIZATION_POLICY.md
          test ! -e .github/workflows/apply-p0-01-authorization-foundation.yml
          test ! -e .tmp

      - name: Commit and push implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add P0-01 authorization policy foundation"
          git push origin HEAD:agent/p0-01-authorization-foundation
