                if (!matchingCurrency.length) {
                  return {
                    allowed: false,
                    permission,
                    reason: isSelfApproval ? "SELF_APPROVAL_DENIED" : "CURRENCY_MISMATCH",
                  };
                }
                if (resource.amount > Math.max(
                  ...matchingCurrency.map((limit) => limit.maximumAmount),
                )) {
