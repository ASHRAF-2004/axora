            type: RoleScopeType;
            companyId?: string;
            branchId?: string;
            departmentId?: string;
            supplierId?: string;
            deliveryAssignmentId?: string;
          }

          export interface PermissionDelegation {
            active: boolean;
            startsAt: Date;
            endsAt: Date;
            permissions: readonly PermissionCode[];
            scopes: readonly AuthorizationScope[];
          }

          export interface ApprovalLimit {
            permission:
