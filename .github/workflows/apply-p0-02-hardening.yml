name: Apply P0-02 hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the P0-02 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/p0-02-isolation-closure
          persist-credentials: true
          fetch-depth: 1

      - name: Apply deterministic source patch
        run: |
          set -euo pipefail
          python3 scripts/ci/apply_p0_02_account_invitation_hardening.py
          python3 -m py_compile scripts/ci/apply_p0_02_account_invitation_hardening.py

      - name: Commit reviewed source changes
        run: |
          set -euo pipefail
          git add \
            src/lib/account-setup.ts \
            src/app/'(portal)'/users/actions.ts \
            src/lib/scoped-operations.ts \
            tests/account-setup-lifecycle.test.ts
          if git diff --cached --quiet; then
            echo "The reviewed hardening patch is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire invitation authorization into write transactions [skip ci]"
          git push origin HEAD:agent/p0-02-isolation-closure
