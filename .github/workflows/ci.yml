name: CI

# Deliberately verification-only. The locked Ubuntu poller performs deployment
# after protected main advances and repeats every gate locally.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  fix_p0_01_authorization_role_type:
    name: Fix canonical authorization role typing
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.ref == 'agent/p0-01-authorization-foundation'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/p0-01-authorization-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Narrow the policy role key and restore CI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/lib/authorization-policy.ts")
          source = path.read_text()

          marker = """} as const satisfies
            Readonly<Partial<Record<KnownUserRole, readonly PermissionCode[]>>>;

          const knownPermissionCodes"""
          replacement = """} as const satisfies
            Readonly<Partial<Record<KnownUserRole, readonly PermissionCode[]>>>;

          export type AuthorizationRole = keyof typeof ROLE_DEFAULT_PERMISSIONS;

          const knownPermissionCodes"""
          if source.count(marker) != 1:
              raise RuntimeError("Authorization role type insertion point is not unique")
          source = source.replace(marker, replacement, 1)

          old_return = "): KnownUserRole | undefined {"
          new_return = "): AuthorizationRole | undefined {"
          if source.count(old_return) != 1:
              raise RuntimeError("Canonical role return type is not unique")
          source = source.replace(old_return, new_return, 1)

          old_contract = "function roleScopeContract(role: KnownUserRole) {"
          new_contract = "function roleScopeContract(role: AuthorizationRole) {"
          if source.count(old_contract) != 1:
              raise RuntimeError("Role-scope contract signature is not unique")
          source = source.replace(old_contract, new_contract, 1)

          path.write_text(source)
          PY
          git fetch --no-tags origin main
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check

      - name: Commit and push the fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/authorization-policy.ts .github/workflows/ci.yml
          git commit -m "Fix authorization role key typing"
          git push origin HEAD:agent/p0-01-authorization-foundation

  application:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare deterministic manual artifacts
        run: |
          mkdir -p output/pdf
          cp -f public/manuals/*.pdf output/pdf/

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build the production application
        run: npm run build

      - name: Install the browser used by interaction checks
        run: npx playwright install --with-deps chromium

      - name: Test critical browser journeys
        run: npm run test:e2e

      - name: Retain browser evidence after a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Build production container
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate production deployment assets
        run: scripts/production/validate-assets.sh

      - name: Build without production secrets
        run: >-
          docker build
          --build-arg "AXORA_REVISION=${GITHUB_SHA}"
          --file Dockerfile
          --tag "axora-ci:${GITHUB_SHA}"
          .

      - name: Verify the image revision
        run: >-
          test
          "$(docker image inspect
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          "axora-ci:${GITHUB_SHA}")"
          = "${GITHUB_SHA}"
