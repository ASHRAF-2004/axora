name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/ashraf-2004/axora
  AXORA_DRIVER_MAP_OPERATIONAL_READY: "true"
  NEXT_PUBLIC_AXORA_MAP_PROVIDER_ID: axora-mvp-klang-valley
  NEXT_PUBLIC_AXORA_MAP_PROVIDER_NAME: Axora self-hosted Klang Valley streets
  NEXT_PUBLIC_AXORA_MAP_STYLE_URL: /maps/axora-mvp-operational-style.json
  NEXT_PUBLIC_AXORA_MAP_ATTRIBUTION: OpenStreetMap contributors
  NEXT_PUBLIC_AXORA_MAP_ATTRIBUTION_URL: https://www.openstreetmap.org/copyright
  NEXT_PUBLIC_AXORA_MAP_COVERAGE_BOUNDS: 101.35,2.70,102.00,3.45
  NEXT_PUBLIC_AXORA_MAP_COVERAGE_LABEL: Klang Valley, Putrajaya and Cyberjaya pilot region

jobs:
  image:
    name: Build immutable production image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production-image-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Configure Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build the production image once
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AXORA_REVISION=${{ github.sha }}
            AXORA_DRIVER_MAP_OPERATIONAL_READY=${{ env.AXORA_DRIVER_MAP_OPERATIONAL_READY }}
            NEXT_PUBLIC_AXORA_MAP_PROVIDER_ID=${{ env.NEXT_PUBLIC_AXORA_MAP_PROVIDER_ID }}
            NEXT_PUBLIC_AXORA_MAP_PROVIDER_NAME=${{ env.NEXT_PUBLIC_AXORA_MAP_PROVIDER_NAME }}
            NEXT_PUBLIC_AXORA_MAP_STYLE_URL=${{ env.NEXT_PUBLIC_AXORA_MAP_STYLE_URL }}
            NEXT_PUBLIC_AXORA_MAP_ATTRIBUTION=${{ env.NEXT_PUBLIC_AXORA_MAP_ATTRIBUTION }}
            NEXT_PUBLIC_AXORA_MAP_ATTRIBUTION_URL=${{ env.NEXT_PUBLIC_AXORA_MAP_ATTRIBUTION_URL }}
            NEXT_PUBLIC_AXORA_MAP_COVERAGE_BOUNDS=${{ env.NEXT_PUBLIC_AXORA_MAP_COVERAGE_BOUNDS }}
            NEXT_PUBLIC_AXORA_MAP_COVERAGE_LABEL=${{ env.NEXT_PUBLIC_AXORA_MAP_COVERAGE_LABEL }}

      - name: Record and verify the immutable digest
        id: artifact
        if: github.event_name == 'push'
        shell: bash
        run: |
          digest="${{ steps.build.outputs.digest }}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Build did not produce a valid OCI digest.\n' >&2
            exit 1
          }
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$digest" >/dev/null
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_TAILSCALE_HOST }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER || 'axora-deploy' }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Join the production tailnet
        uses: tailscale/github-action@a392da0a182bba0e9613b6243ebd69529b1878aa # v4.1.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:axora-github-deploy
          version: 1.90.4
          ping: ${{ vars.PRODUCTION_TAILSCALE_HOST }}

      - name: Configure pinned production SSH access
        shell: bash
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'The image job did not provide a valid OCI digest.\n' >&2
            exit 1
          }
          [[ "$PRODUCTION_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || {
            printf 'PRODUCTION_SSH_HOST is missing or invalid.\n' >&2
            exit 1
          }
          [[ "$PRODUCTION_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            printf 'PRODUCTION_SSH_USER is missing or invalid.\n' >&2
            exit 1
          }
          if [[ ! "$PRODUCTION_SSH_PORT" =~ ^[0-9]+$ ]] \
            || (( PRODUCTION_SSH_PORT < 1 || PRODUCTION_SSH_PORT > 65535 )); then
            printf 'PRODUCTION_SSH_PORT is invalid.\n' >&2
            exit 1
          fi
          [[ -n "$PRODUCTION_SSH_PRIVATE_KEY" ]] || exit 1
          [[ -n "$PRODUCTION_SSH_KNOWN_HOSTS" ]] || exit 1

          ssh_dir="$RUNNER_TEMP/axora-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null

          known_host="$PRODUCTION_SSH_HOST"
          if [[ "$PRODUCTION_SSH_PORT" != "22" ]]; then
            known_host="[$PRODUCTION_SSH_HOST]:$PRODUCTION_SSH_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$ssh_dir/known_hosts" >/dev/null

      - name: Deploy the exact tested image
        shell: bash
        run: |
          ssh_dir="$RUNNER_TEMP/axora-ssh"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            -i "$ssh_dir/id_ed25519" \
            -p "$PRODUCTION_SSH_PORT" \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "deploy $GITHUB_SHA $IMAGE_DIGEST"
