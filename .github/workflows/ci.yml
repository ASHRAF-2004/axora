name: CI

# Deliberately verification-only. The locked Ubuntu poller performs deployment
# after protected main advances and repeats every gate locally.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  apply_p0_01_effective_access:
    name: Apply prepared effective-access integration
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.ref == 'agent/p0-01-effective-access-session'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/p0-01-effective-access-session
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed patches and remove scaffolding
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/refactor/AUTHORIZATION_POLICY.md")
          source = path.read_text()
          current = "Status: implementation foundation for the canonical backlog dated 6 August 2026.\n"
          expected = "Status: implemented as an expand-compatible foundation. Existing production\n"
          if current in source:
              path.write_text(source.replace(current, expected, 1))
          elif expected not in source:
              raise RuntimeError("Authorization policy status line is not recognized")
          PY
          python3 .tmp/apply-p0-01-effective-access.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/refactor/AUTHORIZATION_POLICY.md")
          source = path.read_text()
          old = (
              "Status: implemented as an expand-compatible foundation. See "
              "[Live effective-access runtime](EFFECTIVE_ACCESS_RUNTIME.md) for the "
              "authenticated request integration. Existing production\n"
          )
          new = (
              "Status: implemented as an expand-compatible foundation. See "
              "[Live effective-access runtime](EFFECTIVE_ACCESS_RUNTIME.md) for the "
              "authenticated request integration.\n"
          )
          if old not in source:
              raise RuntimeError("Authorization runtime documentation link was not applied")
          path.write_text(source.replace(old, new, 1))
          PY
          rm -rf .tmp
          git fetch --no-tags origin main:refs/remotes/origin/main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          test -f database/migrations/037_effective_access_snapshot.sql
          test -f src/lib/effective-access.ts
          test -f src/lib/effective-auth.ts
          test -f tests/effective-access.test.ts
          test -f tests/effective-auth.test.ts
          test -f tests/effective-access-migration.test.ts
          test -f docs/refactor/EFFECTIVE_ACCESS_RUNTIME.md
          test ! -e .tmp

      - name: Commit and push clean implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add live effective-access authorization"
          git push origin HEAD:agent/p0-01-effective-access-session

  application:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare deterministic manual artifacts
        run: |
          mkdir -p output/pdf
          cp -f public/manuals/*.pdf output/pdf/

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build the production application
        run: npm run build

      - name: Install the browser used by interaction checks
        run: npx playwright install --with-deps chromium

      - name: Test critical browser journeys
        run: npm run test:e2e

      - name: Retain browser evidence after a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Build production container
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate production deployment assets
        run: scripts/production/validate-assets.sh

      - name: Build without production secrets
        run: >-
          docker build
          --build-arg "AXORA_REVISION=${GITHUB_SHA}"
          --file Dockerfile
          --tag "axora-ci:${GITHUB_SHA}"
          .

      - name: Verify the image revision
        run: >-
          test
          "$(docker image inspect
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          "axora-ci:${GITHUB_SHA}")"
          = "${GITHUB_SHA}"