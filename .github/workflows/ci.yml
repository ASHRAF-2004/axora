name: CI

# Deliberately verification-only. The locked Ubuntu poller performs deployment
# after protected main advances and repeats every gate locally.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  application:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare deterministic manual artifacts
        run: |
          mkdir -p output/pdf
          cp -f public/manuals/*.pdf output/pdf/

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/test-evidence
          npm run test 2>&1 | tee output/test-evidence/vitest.log

      - name: Retain unit-test evidence after a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/test-evidence/vitest.log
          if-no-files-found: error
          retention-days: 3

      - name: Build the production application
        run: npm run build

      - name: Install the browser used by interaction checks
        run: npx playwright install --with-deps chromium

      - name: Test critical browser journeys
        run: npm run test:e2e

      - name: Retain browser evidence after a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Build production container
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate production deployment assets
        run: scripts/production/validate-assets.sh

      - name: Build without production secrets
        run: >-
          docker build
          --build-arg "AXORA_REVISION=${GITHUB_SHA}"
          --file Dockerfile
          --tag "axora-ci:${GITHUB_SHA}"
          .

      - name: Verify the image revision
        run: >-
          test
          "$(docker image inspect
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          "axora-ci:${GITHUB_SHA}")"
          = "${GITHUB_SHA}"