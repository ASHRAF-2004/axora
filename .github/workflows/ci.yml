name: CI

# Deliberately verification-only. The locked Ubuntu poller performs deployment
# after protected main advances and repeats every gate locally.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  application:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare deterministic manual artifacts
        run: |
          mkdir -p output/pdf
          cp -f public/manuals/*.pdf output/pdf/

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build the production application
        run: npm run build

      - name: Install the browser used by interaction checks
        run: npx playwright install --with-deps chromium

      - name: Test critical browser journeys
        run: npm run test:e2e

      - name: Retain browser evidence after a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Build production container
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate production deployment assets
        run: scripts/production/validate-assets.sh

      - name: Build without production secrets
        run: >-
          docker build
          --build-arg "AXORA_REVISION=${GITHUB_SHA}"
          --file Dockerfile
          --tag "axora-ci:${GITHUB_SHA}"
          .

      - name: Verify the image revision
        run: >-
          test
          "$(docker image inspect
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          "axora-ci:${GITHUB_SHA}")"
          = "${GITHUB_SHA}"

  prepare-role-scope-lifecycle:
    name: Apply role and scope lifecycle integration
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/p0-01-role-scope-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/p0-01-role-scope-lifecycle
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Apply reviewed patches
        run: |
          python scripts/ci/prepare-role-scope-lifecycle.py
          python scripts/ci/rewrite-role-lifecycle-functions.py

      - name: Install locked dependencies
        run: npm ci

      - name: Identify the exact migration statement boundary
        run: >-
          npx vitest run
          tests/role-scope-migration-diagnostic.test.ts
          --reporter=verbose

      - name: Verify focused authorization slice
        run: |
          npm run lint
          npm run typecheck
          npx vitest run \
            tests/role-scope-management.test.ts \
            tests/role-scope-lifecycle-migration.test.ts \
            tests/full-migration-chain.test.ts \
            tests/support-diagnostics-migration.test.ts \
            tests/account-security-session-audit-migration.test.ts \
            tests/application-grants-security.test.ts \
            tests/account-setup-lifecycle.test.ts \
            tests/user-management-security.test.ts

      - name: Commit and push clean implementation
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f \
            scripts/ci/prepare-role-scope-lifecycle.py \
            scripts/ci/rewrite-role-lifecycle-functions.py \
            tests/role-scope-migration-diagnostic.test.ts
          git diff --check
          git config user.name "Axora Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add audited role and scope lifecycle"
          git push origin HEAD:agent/p0-01-role-scope-lifecycle
