name: Nightly quality

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
          cache: npm
      - run: npm ci --prefer-offline
      - name: Lint and explicit typecheck
        run: npm run lint && npm run typecheck
      - name: Install manual font prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: false
      - name: Verify deterministic published manuals
        run: npm run manuals:verify
      - name: Unit and PGlite migration suite
        run: npm run test
      - name: Native PostgreSQL migration, RLS, and grants suite
        run: npm run test:postgres-native
      - name: Production build and standalone staging
        run: npm run build && npm run standalone:stage && npm run standalone:validate
      - name: Browser journeys
        run: npx playwright install --with-deps chromium && npm run test:e2e
