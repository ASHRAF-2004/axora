name: Verify live login theme

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-live-login-theme
  cancel-in-progress: true

jobs:
  verify-live:
    name: Verify axora.management login theme
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out verification code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the browser used for live verification
        run: npx playwright install --with-deps chromium

      - name: Wait for production and verify the public login experience
        shell: bash
        run: |
          set -Eeuo pipefail

          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";

          const baseUrl = "https://axora.management";
          const browser = await chromium.launch();
          const context = await browser.newContext({
            locale: "en-US",
            viewport: { width: 1280, height: 900 },
          });
          await context.addCookies([
            {
              name: "axora_locale",
              value: "en",
              url: baseUrl,
            },
          ]);

          let lastError = null;

          for (let attempt = 1; attempt <= 80; attempt += 1) {
            const page = await context.newPage();

            try {
              const cacheBuster = `${process.env.GITHUB_RUN_ID}-${attempt}-${Date.now()}`;
              const readyResponse = await fetch(
                `${baseUrl}/api/health/ready?verify=${cacheBuster}`,
                {
                  headers: { "Cache-Control": "no-cache" },
                  signal: AbortSignal.timeout(20_000),
                },
              );
              const readyBody = await readyResponse.text();

              if (!readyResponse.ok || !readyBody.includes('"status":"ready"')) {
                throw new Error(
                  `Readiness failed: ${readyResponse.status} ${readyBody.slice(0, 160)}`,
                );
              }

              await page.goto(`${baseUrl}/login?verify=${cacheBuster}`, {
                waitUntil: "domcontentloaded",
                timeout: 25_000,
              });

              const backLink = page.getByRole("link", {
                name: "Back to website",
              });
              await backLink.waitFor({ state: "visible", timeout: 12_000 });

              if ((await backLink.getAttribute("href")) !== "/en") {
                throw new Error("The login return link does not target /en.");
              }

              const buttonColor = await page.locator("#login").evaluate(
                (element) => getComputedStyle(element).backgroundColor,
              );
              if (buttonColor !== "rgb(11, 45, 82)") {
                throw new Error(`Unexpected login button color: ${buttonColor}`);
              }

              const pageBackground = await page.locator("main").evaluate(
                (element) => getComputedStyle(element).backgroundImage,
              );
              if (!pageBackground.includes("linear-gradient")) {
                throw new Error("The Axora navy login background is not active.");
              }

              const guide = page.locator(".login-guide");
              await guide.locator("svg").waitFor({
                state: "visible",
                timeout: 15_000,
              });

              const yetiBackground = await guide
                .locator(".mySVG > circle")
                .evaluate((element) => getComputedStyle(element).fill);
              if (yetiBackground !== "rgb(232, 163, 61)") {
                throw new Error(
                  `Unexpected Yeti accent color: ${yetiBackground}`,
                );
              }

              const yetiOutline = await guide
                .locator(".bodyBGnormal")
                .evaluate((element) => getComputedStyle(element).stroke);
              if (yetiOutline !== "rgb(11, 45, 82)") {
                throw new Error(`Unexpected Yeti outline: ${yetiOutline}`);
              }

              const email = page.locator("#loginEmail");
              await email.focus();
              const focusedBorder = await email.evaluate(
                (element) => getComputedStyle(element).borderColor,
              );
              if (focusedBorder !== "rgb(154, 91, 8)") {
                throw new Error(
                  `Unexpected focused input border: ${focusedBorder}`,
                );
              }

              const originalEye = await guide.locator(".eyeL").elementHandle();
              if (!originalEye) throw new Error("The Yeti eye was unavailable.");
              await email.type("ashraf@example.com", { delay: 6 });
              const eyePreserved = await originalEye.evaluate(
                (node) => document.querySelector(".login-guide .eyeL") === node,
              );
              if (!eyePreserved) {
                throw new Error("The themed login replaced the animated eye node.");
              }

              const password = page.locator("#loginPassword");
              await password.focus();
              await password.type("x");
              const arm = guide.locator(".armL");
              const armState = await arm.evaluate((element) => ({
                visibility: element.style.visibility,
                transform: element.style.transform,
              }));
              if (
                armState.visibility !== "visible" ||
                !armState.transform.includes("translate(-93px, 10px)")
              ) {
                throw new Error(
                  `The Yeti no longer covers its eyes: ${JSON.stringify(armState)}`,
                );
              }

              await page.setViewportSize({ width: 390, height: 844 });
              await backLink.waitFor({ state: "visible" });
              const overflow = await page.evaluate(
                () =>
                  document.documentElement.scrollWidth -
                  document.documentElement.clientWidth,
              );
              if (overflow > 2) {
                throw new Error(`Mobile login has ${overflow}px horizontal overflow.`);
              }

              console.log(
                `Attempt ${attempt}: themed login and return navigation are live.`,
              );
              await page.close();
              await browser.close();
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(
                `Attempt ${attempt}: ${
                  error instanceof Error ? error.message : String(error)
                }`,
              );
              await page.close();
              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }
          }

          await browser.close();
          throw lastError ?? new Error("Live login-theme verification timed out.");
          NODE
